[project]
name = "league-analysis"
version = "0.1.0"
description = "Web app for comprehensive analysis of League of Legends players, matches and more."
authors = [
    { name = "Matěj Kadlec", email = "mat.kadlec@email.cz" },
]
dependencies = [
    "alembic>=1.19.1",
    # Alembic's autogenerate does not diff enum MEMBERS at all, so adding a
    # value to a Python enum without an `ALTER TYPE` passes `alembic check` and
    # then fails at runtime with InvalidTextRepresentation. This registers an
    # enum comparator on the standard hook. It is a runtime dependency, not a
    # dev one: the ops it generates (`op.sync_enum_values`) live in revision
    # files that production has to execute.
    "alembic-postgresql-enum>=1.10.0",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[argon2]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.5",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.3",
    "starlette>=1.6.0",
    "tenacity>=9.1.4",
]
requires-python = ">=3.14,<3.15"
license = { text = "All Rights Reserved" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
# `alembic` is deliberately outside this list. Revisions are an append-only
# record of what was already applied to a live database, so editing a merged
# one to satisfy a type checker changes a historical document without changing
# the schema it produced, and `env.py` is framework boilerplate. The schema
# authority is the revision itself plus `scripts/validate_migrations.py`, which
# is checked.
include = ["app", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.pytest_cache", ".venv"]
# Without these, Pyright resolves imports against whatever interpreter it finds
# rather than this project's environment, and every third-party import becomes
# `Unknown`. That inflates a strict-mode run from a few hundred real errors to
# several thousand phantom ones, so the two settings are load-bearing for
# anyone running Pyright outside `uv run`.
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = "none"
# `reportUnnecessaryIsInstance` and `reportUnnecessaryComparison` are back at
# their strict-mode default of "error" since 2026-08-17. They were off while
# the ORM models described columns more confidently than the migrated schema
# did, so `is None` and `isinstance` guards protected against values the
# annotations called impossible. Revision 20260816_0014 closed that gap;
# turning them back on reported exactly one dead guard repo-wide, not the
# sweep the disabling comment feared.
# Rules Pyright leaves off even in strict mode. These five are enabled because
# they cost nothing to keep passing; the ones deliberately left off are:
#   reportUnusedCallResult (106)          flags every discarded return value
#   reportImplicitStringConcatenation (37) style, and it fights the wrapped
#     message strings this codebase uses throughout
#   reportMissingSuperCall (16)           the ORM and Pydantic base classes do
#     not want a chained __init__ in every subclass
# On since every FastAPI parameter uses the `Annotated[T, Depends(...)]` form.
# It was off while 88 routes spelled their dependencies as call defaults, which
# is also why Ruff's B008 was ignored; both suppressions are gone now, so a
# `datetime.now()` or a shared mutable default anywhere in `app/` is reported.
reportCallInDefaultInitializer = "error"
reportUninitializedInstanceVariable = "error"
reportPropertyTypeMismatch = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# Requires @override on every overriding method, so a renamed or mistyped base
# method turns into a type error instead of a silently orphaned override.
reportImplicitOverride = "error"

# `tests` is checked at the same strictness as `app`, with one exception. A
# test suite legitimately reaches for the private helper it is testing:
# `_binding_signature`, `_upsert_match` and friends are exactly the units worth
# covering directly. Leaving reportPrivateUsage on would force the choice
# between widening a production interface for the test's benefit or not testing
# the unit at all, and both are worse than the rule. Every other strict
# diagnostic still applies here — notably reportArgumentType, which is what
# catches a test asserting against a signature the application no longer has.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
# --disable-socket: the suite is offline by construction — it mocks Riot and
# never opens the database. Nothing enforced that, so a new test could quietly
# start making real Riot calls: burning the rate limit, failing whenever the
# key rotates, and passing or failing on live data. A test that genuinely
# needs a socket must say so with @pytest.mark.enable_socket.
addopts = [
    "-ra",
    "--disable-socket",
    # asyncio builds every event loop's self-pipe from an AF_UNIX socketpair,
    # so blocking that blocks every async test. It reaches no network.
    "--allow-unix-socket",
]
# With `asyncio_mode = "auto"`, one await that never resolves hangs the run
# until CI's 90-minute job timeout kills it, naming no test. 60s is far above
# the whole suite's 33s, so it can only fire on a genuine hang.
timeout = 60
timeout_method = "thread"
asyncio_mode = "auto"
# pytest 9's umbrella, replacing `--strict-config` / `--strict-markers` in
# `addopts` and a standalone `strict_xfail`. It turns on all four strictness
# options at once, and the fourth is the one that was missing:
# `strict_parametrization_ids` caught eleven duplicate ids in
# `test_timestamp_columns.py`, where every table's `created_at` and
# `updated_at` case shared one name.
# As ini options rather than `addopts` deliberately: pytest 9.0 silently
# ignored these two when they arrived through `addopts` (#14442, fixed by the
# 9.1.1 pinned here -- verified by probe, an unknown marker still errors).
# A strictness flag that can go quiet is worth spelling the safe way.
strict = true
# `strict` includes `strict_markers`, so an unregistered marker is a collection
# error. `enable_socket` is registered by pytest-socket's own `pytest_configure`;
# only this tier's own marker needs a line here.
markers = [
    "integration: needs the PostgreSQL the gate starts; skips when none answers",
]
filterwarnings = [
    "error",
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:slowapi.extension",
]
testpaths = ["tests"]
# pytest-randomly shuffles within each module and reseeds `random` per test, so
# a test that only passes because another ran first is found by machine rather
# than by hand. `conftest.py` already had to reset one process-global by hand;
# this is what finds the next one. Proven over 20 seeds before adopting -- a
# gate that fails on a seed would be a flaky gate. The failing seed is printed
# in the header, so any failure is reproducible with `-p randomly --randomly-seed=N`.

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    # Blocking calls inside `async def`. The whole backend is async and a
    # single synchronous call stalls the event loop for every request, which
    # no test reproduces and no reviewer reliably spots.
    "ASYNC",
    "B",
    "C4",
    "LOG",
    "N",
    # The test suite's own hygiene. Most of PT is already true here by
    # convention, so it costs nothing to keep passing; the two rules that earn
    # it are PT011 and PT018. `pytest.raises(ValueError)` with no `match=` is
    # the shape a generator reaches for on every error path, and it passes on
    # the `ValueError` a bug raises as readily as the one the test names.
    # `assert a and b` hides a half that can rot silently. `raises-require-
    # match-for` stays at its default list: the 31 `pytest.raises(HTTPException)`
    # sites discriminate on `excinfo.value.status_code`, which is a better
    # assertion than a message regex, and adding HTTPException would force the
    # worse one.
    "PT",
    "PTH",
    # `mock.assert_called` without the parentheses is an attribute access: it
    # is always truthy, asserts nothing, and reads exactly like the call that
    # would have checked something. PGH005 is the only rule that sees it.
    "PGH",
    # Three assertions that cannot fail, from `PL`. Selected individually
    # because the rest of `PL` is style -- PLR2004 alone would report every
    # numeric literal a test compares against, which is most of them.
    "PLR0124",
    "PLR0133",
    "PLW0129",
    "RUF",
    "SIM",
    "TID",
    "UP",
]
ignore = [
    # Not every exception is an error. `JobStopSignal` and `RateLimitSignal`
    # are control flow, and the `*Refusal` names in scripts/ are a deliberate
    # vocabulary for "this tool declined to act". Renaming them to `*Error`
    # would describe them less accurately than their current names do.
    "N818",
    # `StrEnum` is not a drop-in replacement for `str, Enum`: it changes what
    # `str()` and f-strings produce, from `JobType.MATCH_FETCHER` to the bare
    # value. These enums are exactly the ones that reach a PostgreSQL enum
    # column (`JobType`, `JobStatus`, `ExecutionType`) or a Riot URL (`Region`,
    # `Platform`), so the rewrite is a data-format change wearing a lint's
    # clothing. Worth doing deliberately, with a migration; not as a lint fix.
    "UP042",
]

[tool.ruff.lint.isort]
# scripts is listed explicitly because implicit first-party detection depends
# on the working directory: the gate runs Ruff from backend/ and the pre-commit
# hook from the repository root, and they disagreed on where
# `from scripts import ...` belongs until the classification was pinned.
known-first-party = ["app", "route_helpers", "scripts"]
# `alembic` is the same problem with the opposite answer. Run from backend/,
# Ruff sees the `alembic/` directory and calls it first-party; run from the
# repository root it does not, and calls it third-party. `from alembic import
# context` imports the library either way, so third-party is the true answer --
# without this the gate and the pre-commit hook each rewrite `env.py` back.
known-third-party = ["alembic"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.23.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Pinned exactly, like ruff: a Pyright release can add strict-mode
    # diagnostics, and a gate that calls itself deterministic cannot have its
    # type checker tighten underneath it on an unrelated commit.
    "pyright==1.1.411",
    "ruff==0.16.6",
    "vulture>=2.16",
    "xenon>=0.9.3",
    "pytest-socket>=0.7.0",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.0.0",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# A floor, not a target. Measured 2026-08-30: 78.53% with branch coverage on
# (8,624 statements, 1,620 branches), and 78.30% on a host with no PostgreSQL,
# where the integration tier skips. The branch figure is the honest one,
# because a half-tested `if` is half-tested. The floor sits ~2 points under the
# measurement so ordinary fluctuations do not flip the gate; ratchet it on the
# way out of every batch, or it stops catching anything. It is armed by the
# `--cov` flags in test.sh; a bare `pytest` stays fast.
fail_under = 76
show_missing = true

[tool.vulture]
min_confidence = 80
paths = ["app"]
ignore_decorators = ["@router.*", "@app.*"]
ignore_names = [
    "model_config",
    # Vulture is whole-program: a name read anywhere counts as used everywhere.
    # Until this batch, the single `cls.` read in app/ was
    # `matches/service.py:is_current_game_version`; moving that to a module
    # function made every `@field_validator` receiver in the codebase look
    # dead at once. `cls` is a mandatory receiver name, never a dead variable.
    "cls",
    # Parameters of `Protocol` method stubs. The stubs exist to give types to
    # untyped third-party libraries (passlib's hashing context, APScheduler's
    # scheduler), so their bodies are `...` and Vulture cannot see that the
    # names are consumed — but every one of these is passed at a real call
    # site: `trigger="interval"` and `replace_existing=True` at
    # scheduler.py:539, `run_date=now` at 700, `wait=False` at 822, and
    # `secret` positionally by both password wrappers. Verified before adding;
    # a genuinely dead parameter with one of these names would now be missed,
    # which is the cost of Vulture having no notion of a protocol.
    "secret",
    "wait",
    "trigger",
    "replace_existing",
    "run_date",
]

[tool.deptry]
extend_exclude = ["tests", "scripts", "alembic"]

[tool.deptry.per_rule_ignores]
# Drivers and plugin extras are required at runtime but imported by
# SQLAlchemy, Pydantic, or FastAPI rather than application code. The two
# alembic entries are imported by `alembic/env.py`, which `extend_exclude`
# keeps out of the scan.
DEP002 = [
    "alembic",
    "alembic-postgresql-enum",
    "asyncpg",
    "email-validator",
    "psycopg2-binary",
    "python-multipart",
]
