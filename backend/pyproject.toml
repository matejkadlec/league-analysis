[project]
name = "league-analysis"
version = "0.1.0"
description = "Web app for comprehensive analysis of League of Legends players, matches and more."
authors = [{ name = "Matěj Kadlec", email = "mat.kadlec@email.cz" }]
dependencies = [
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[argon2]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyjwt[crypto]>=2.13.0",
    "python-Levenshtein>=0.27.3",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
]
requires-python = ">=3.14.6,<3.15"
license = { text = "All Rights Reserved" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/tests", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:slowapi.extension",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.per-file-target-version]
"../scripts/*.py" = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.411",
    "ruff==0.16.1",
]
