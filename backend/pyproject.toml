[project]
name = "league-analysis"
version = "0.1.0"
description = "Web app for comprehensive analysis of League of Legends players, matches and more."
authors = [
    { name = "Matěj Kadlec", email = "mat.kadlec@email.cz" },
    { name = "Marek Hovadík", email = "marek.hovadik@seznam.cz" },
]
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib[argon2]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "pyjwt[crypto]>=2.13.0",
    "python-Levenshtein>=0.27.4",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
]
requires-python = ">=3.14,<3.15"
license = { text = "All Rights Reserved" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/tests", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
# --disable-socket: the suite is offline by construction — it mocks Riot and
# never opens the database. Nothing enforced that, so a new test could quietly
# start making real Riot calls: burning the rate limit, failing whenever the
# key rotates, and passing or failing on live data. A test that genuinely
# needs a socket must say so with @pytest.mark.enable_socket.
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--disable-socket",
    # asyncio builds every event loop's self-pipe from an AF_UNIX socketpair,
    # so blocking that blocks every async test. It reaches no network.
    "--allow-unix-socket",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:slowapi.extension",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# scripts is listed explicitly because implicit first-party detection depends
# on the working directory: the gate runs Ruff from backend/ and the pre-commit
# hook from the repository root, and they disagreed on where
# `from scripts import ...` belongs until the classification was pinned.
known-first-party = ["app", "scripts"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.23.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.411",
    "ruff==0.16.2",
    "vulture>=2.16",
    "xenon>=0.9.3",
    "pytest-socket>=0.7.0",
]

[tool.vulture]
min_confidence = 80
paths = ["app"]
ignore_decorators = ["@router.*", "@app.*"]
ignore_names = [
    "model_config",
]

[tool.deptry]
extend_exclude = ["tests", "scripts", "alembic"]

[tool.deptry.package_module_name_map]
python-Levenshtein = "Levenshtein"

[tool.deptry.per_rule_ignores]
# Drivers and plugin extras are required at runtime but imported by
# SQLAlchemy, Pydantic, or FastAPI rather than application code.
DEP002 = [
    "alembic",
    "asyncpg",
    "email-validator",
    "psycopg2-binary",
    "python-multipart",
]
