name: Quality Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Deterministic full-project gate
    # The Pi, not a GitHub-hosted runner. GitHub bills Actions minutes only for
    # its own hardware -- "GitHub Actions usage is free for self-hosted
    # runners" -- and this account's included minutes were nearly spent, while
    # the runner that deploys is idle between merges.
    #
    # It is also the more honest place to run: pi5ram16 is aarch64, so the
    # container QA below now builds and boots the same architecture production
    # actually serves, instead of amd64 images that never ship anywhere.
    runs-on: [self-hosted, pi5ram16]
    # Four Cortex-A76 cores against a hosted runner's eight, and the gate
    # builds the frontend for the Playwright suite. The deploy workflow uses
    # the same runner, so a merge waits for a gate already in flight.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate's secret scan reads the commit history, so the default
          # single-commit checkout would quietly cover less here than locally.
          fetch-depth: 0
          persist-credentials: false

      # compose.gate.yml carries the toolchain, the disposable PostgreSQL 18 and
      # every connection setting, so this is the same command a contributor runs.
      # Layer/package caching was measured here (runs 31684471945/31685001113)
      # and removed: restoring a cache from GitHub storage costs as much as the
      # work it saves on these runners. The compose cache volumes still speed
      # local runs, where they are measured at 25%.
      - name: Run the gate in its pinned container
        run: |
          LGA_GATE_UID="$(id -u)" LGA_GATE_GID="$(id -g)" \
            docker compose --file compose.gate.yml run --rm --build --no-TTY gate

      - name: Build and verify isolated production containers
        run: ./deploy/container-qa.sh

      # This runner is the production host, so the gate has to clean up after
      # itself: every run leaves a rebuilt gate image and its build cache
      # behind, and the box was already holding 22GB of reclaimable cache
      # before this workflow moved here.
      #
      # Only unreferenced things, and never volumes -- production's PostgreSQL
      # data is a named volume, and `docker volume prune` does not ask twice.
      # Dangling images are untagged by definition, so the release-per-commit
      # tags the deploy keeps are untouched.
      - name: Reclaim disposable build space
        if: always()
        run: |
          docker image prune --force
          docker builder prune --force --filter until=168h
