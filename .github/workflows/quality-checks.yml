name: Quality Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Deterministic full-project gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Hosted runners start with no Docker layer cache, so the gate image is
      # built through the GitHub Actions cache backend instead of from scratch.
      - name: Build the gate image with a layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: gate.Dockerfile
          tags: lga-gate-gate
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore package caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/lga-gate-npm-cache
            /tmp/lga-gate-uv-cache
          key: gate-packages-${{ hashFiles('frontend/package-lock.json', 'backend/uv.lock') }}
          restore-keys: gate-packages-

      # compose.gate.yml carries the toolchain, the disposable PostgreSQL 18 and
      # every connection setting, so this is the same command a contributor runs.
      - name: Run the gate in its pinned container
        run: |
          install -d /tmp/lga-gate-npm-cache /tmp/lga-gate-uv-cache
          LGA_GATE_UID="$(id -u)" LGA_GATE_GID="$(id -g)" \
          LGA_GATE_NPM_CACHE=/tmp/lga-gate-npm-cache \
          LGA_GATE_UV_CACHE=/tmp/lga-gate-uv-cache \
            docker compose --file compose.gate.yml run --rm --no-TTY gate

      - name: Build and verify isolated production containers
        run: ./deploy/container-qa.sh
