name: Quality Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Deterministic full-project gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # compose.gate.yml carries the toolchain, the disposable PostgreSQL 18 and
      # every connection setting, so this is the same command a contributor runs.
      - name: Run the gate in its pinned container
        run: |
          LGA_GATE_UID="$(id -u)" LGA_GATE_GID="$(id -g)" \
            docker compose --file compose.gate.yml run --rm --build --no-TTY gate

      - name: Build and verify isolated production containers
        run: ./deploy/container-qa.sh

  dependency-audit:
    name: Live production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit compares the base revision's locks with this revision's.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install pinned Python
        run: uv python install "$(cat .python-version)"

      - name: Run live dependency audit
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: ./scripts/dependency-audit.sh "$CHANGE_BASE_SHA"
