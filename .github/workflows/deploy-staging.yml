name: Deploy Staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Backend typecheck
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run pyright

  deploy:
    name: Deploy To Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          ssh-add - <<< "$STAGING_SSH_PRIVATE_KEY"

      - name: Sync repository to server
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='untracked/' \
            --exclude='logs/' \
            --exclude='.env' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/.next/' \
            --exclude='backend/.venv/' \
            ./ "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:/srv/league-analysis/"

      - name: Build and restart services on server
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          ssh "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" 'sudo /usr/local/bin/league-deploy.sh'
