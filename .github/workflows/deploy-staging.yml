name: Deploy Staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Backend typecheck
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run pyright

  deploy:
    name: Deploy To Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          ssh-keyscan -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/staging_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_HOST" 'echo ssh_ok'

      - name: Cleanup Python bytecode caches on server
        run: |
          ssh -i ~/.ssh/staging_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${STAGING_USER}@${STAGING_HOST}" \
            'sudo find /srv/league-analysis/backend/app -type d -name __pycache__ -prune -exec rm -rf {} +'

      - name: Sync repository to server
        run: |
          rsync -az --delete \
            --no-times --omit-dir-times \
            -e "ssh -i ~/.ssh/staging_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --exclude='.git/' \
            --exclude='untracked/' \
            --exclude='logs/' \
            --exclude='backups/' \
            --exclude='.cache/' \
            --exclude='.local/' \
            --exclude='.env' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/.next/' \
            --exclude='backend/.venv/' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            ./ "${STAGING_USER}@${STAGING_HOST}:/srv/league-analysis/"

      - name: Build and restart services on server
        run: |
          ssh -i ~/.ssh/staging_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${STAGING_USER}@${STAGING_HOST}" 'sudo /usr/local/bin/league-deploy.sh'
