name: ${LGA_COMPOSE_PROJECT_NAME:-league-analysis}

x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

x-backend-environment: &backend-environment
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the private deployment environment}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the private deployment environment}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the private deployment environment}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DEBUG: "false"
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in the private deployment environment}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the private deployment environment}
  RIOT_API_KEY: ${RIOT_API_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-false}

services:
  postgres:
    <<: *security-defaults
    image: postgres:18.4-bookworm
    container_name: ${LGA_POSTGRES_CONTAINER_NAME:-league-analysis-postgres}
    restart: unless-stopped
    cap_drop: []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the private deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the private deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the private deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 1.5
    networks:
      - database

  migrate:
    <<: *security-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: league-analysis-backend:${LGA_IMAGE_TAG:-production}
    init: true
    restart: "no"
    environment: *backend-environment
    command: ["python", "scripts/migrate.py", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1.0
    networks:
      - database

  backend:
    <<: *security-defaults
    image: league-analysis-backend:${LGA_IMAGE_TAG:-production}
    container_name: ${LGA_BACKEND_CONTAINER_NAME:-league-analysis-backend}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment: *backend-environment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${LGA_BIND_ADDRESS:-0.0.0.0}:${LGA_BACKEND_PORT:-8098}:8000"
    mem_limit: 640m
    cpus: 1.5
    networks:
      - application
      - database

  frontend:
    <<: *security-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in the private deployment environment}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in the private deployment environment}
        NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: league-analysis-frontend:${LGA_IMAGE_TAG:-production}
    container_name: ${LGA_FRONTEND_CONTAINER_NAME:-league-analysis-frontend}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0700
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${LGA_BIND_ADDRESS:-0.0.0.0}:${LGA_FRONTEND_PORT:-8097}:3000"
    mem_limit: 384m
    cpus: 1.0
    networks:
      - application

networks:
  application:
    name: ${LGA_APPLICATION_NETWORK_NAME:-league-analysis-application}
  database:
    name: ${LGA_DATABASE_NETWORK_NAME:-league-analysis-database}
    internal: true

volumes:
  postgres_data:
    name: ${LGA_POSTGRES_VOLUME_NAME:-league-analysis-postgres-data}
