# Pre-commit hooks configuration for League Analysis
# See https://pre-commit.com for more information

repos:
  # Built-in hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements

  # Secret *values* in any file type. The filename hook below only blocks
  # credential-shaped paths, and detect-private-key only matches PEM blocks,
  # so neither catches an API key pasted into a doc, JSON, or test fixture.
  # Scans the staged diff only; the tracked history is clean as of v8.30.1,
  # so no .gitleaksignore is needed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbid-credential-filenames
        name: Forbid credential-looking filenames
        entry: 'A staged filename looks like a credential:'
        language: fail
        files: '(^|/)(\.env|id_rsa|id_ed25519)$|\.(pem|key)$'

      # ESLint has no filename rule and adding a plugin for one convention is
      # not worth the dependency. The tree is fully kebab-case today, so this
      # only ever fires on a new violation. Next.js dynamic segments and route
      # groups are lowercase already, so they pass.
      - id: forbid-non-kebab-frontend-filenames
        name: Frontend source filenames stay kebab-case
        entry: 'Frontend source filenames must be kebab-case:'
        language: fail
        files: '^frontend/(?!node_modules/)(?:[^/]*/)*[^/]*[A-Z_][^/]*\.(?:ts|tsx)$'

      # Reviewed Alembic revisions are the schema authority. This catches the
      # committed-code half of that rule; dropping or resetting a populated
      # schema is a runtime action no hook can see.
      - id: forbid-metadata-create-all
        name: Forbid Base.metadata.create_all (Alembic owns the schema)
        entry: 'metadata\.create_all'
        language: pygrep
        files: \.py$

  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Run the linter
      - id: ruff
        args: ["--fix", "--config=backend/pyproject.toml"]
      # Run the formatter
      - id: ruff-format
        args: ["--config=backend/pyproject.toml"]

  # Backend static analysis via the locked uv project. These stay
  # corpus-wide (`pass_filenames: false` + `always_run`) so a staged
  # subset or a deletion-only commit cannot hide a project-level
  # finding. `--locked` refuses to rewrite uv.lock mid-commit.
  # Pytest and live CVE scans stay out: the former needs the test
  # database, the latter is not deterministic.
  - repo: local
    hooks:
      - id: backend-bandit
        name: Bandit (medium/medium, skip B104)
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked bandit --quiet --recursive app scripts
          --severity-level medium --confidence-level medium --skip B104'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-pyright
        name: Pyright
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked pyright'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-vulture
        name: vulture (dead code, min-confidence 80)
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked vulture'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-deptry
        name: deptry (unused/missing deps)
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked deptry .'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-xenon
        name: xenon (cyclomatic complexity <= B)
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/scripts/run-xenon.sh"'
        language: system
        pass_filenames: false
        always_run: true

  # Frontend linting with Next.js (local hook for better compatibility)
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: >
          bash -c 'export LC_ALL=C.UTF-8 &&
          repository_root="$(git rev-parse --show-toplevel)" &&
          source "$repository_root/scripts/use-project-node.sh" && cd "$repository_root/frontend" &&
          if [ ! -d node_modules ]; then
          echo "❌ ERROR: Frontend dependencies not installed! Run: cd frontend && npm install";
          exit 1;
          fi &&
          npm run lint -- --max-warnings 0 ||
          (echo "❌ Frontend linting failed! Fix errors before committing." && exit 1)'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        exclude: ^frontend/node_modules/
        pass_filenames: false

  # Frontend TypeScript type checking
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: TypeScript Type Check
        entry: >
          bash -c 'export LC_ALL=C.UTF-8 &&
          repository_root="$(git rev-parse --show-toplevel)" &&
          source "$repository_root/scripts/use-project-node.sh" && cd "$repository_root/frontend" &&
          if [ ! -d node_modules ]; then
          echo "❌ ERROR: Frontend dependencies not installed! Run: cd frontend && npm install";
          exit 1;
          fi &&
          npx tsc --noEmit ||
          (echo "❌ TypeScript type checking failed! Fix type errors before committing." && exit 1)'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        exclude: ^frontend/node_modules/
        pass_filenames: false

  # Shell and workflow linting, using the same pinned binaries as the gate
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/scripts/run-shellcheck.sh"'
        language: system
        files: \.sh$|^\.githooks/
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/scripts/run-actionlint.sh"'
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
        pass_filenames: false

# Configuration for pre-commit
default_stages: [pre-commit]
fail_fast: false

# Exclude certain paths from all hooks
exclude: |
  (?x)^(
    \.git/.*|
    \.tox/.*|
    build/.*|
    dist/.*|
    .*\.min\.(js|css)$|
    __pycache__/.*|
    frontend/node_modules/.*
  )$
