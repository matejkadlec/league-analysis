# Pre-commit hooks configuration for League Analysis
# See https://pre-commit.com for more information

repos:
  # Built-in hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements

  # Secret *values* in any file type. The filename hook below only blocks
  # credential-shaped paths, and detect-private-key only matches PEM blocks,
  # so neither catches an API key pasted into a doc, JSON, or test fixture.
  # Scans the staged diff only; the tracked history is clean as of v8.30.1,
  # so no .gitleaksignore is needed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # A bare `.env` was the only env file this caught. The suffixed forms
      # (`.env.local`, `.env.production`) and the `<name>.env` form this
      # project actually deploys with are the ones most likely to be staged by
      # accident. Committable templates are exempt.
      - id: forbid-credential-filenames
        name: Forbid credential-looking filenames
        entry: 'A staged filename looks like a credential:'
        language: fail
        files: '(?i)(^|/)(?!\.env\.(?:example|template|sample)$)(?:\.env(?:\.[^/]+)?|[^/]+\.env|id_rsa|id_dsa|id_ecdsa|id_ed25519|credentials\.json)$|\.(pem|key|p12|pfx)$'

      # No linter here has a filename rule, and a house plugin for one
      # convention costs more than this line. The tree is fully kebab-case
      # today, so this only ever fires on a new violation. Next.js dynamic
      # segments and route
      # groups are lowercase already, so they pass. The check covers every
      # path segment, not just the basename — a PascalCase feature directory
      # is the same violation as a PascalCase file.
      - id: forbid-non-kebab-frontend-filenames
        name: Frontend source filenames stay kebab-case
        entry: 'Frontend source paths must be kebab-case:'
        language: fail
        files: '^frontend/(?!node_modules/)(?=.*(?:[A-Z ]|(?<!/)_)).*\.(?:ts|tsx|js|jsx|mjs|cjs|mts|cts)$'

      # Features depend on core, never the reverse.
      - id: forbid-core-importing-features
        name: app/core must not import app/features
        entry: 'from\s+app\.features|import\s+app\.features'
        language: pygrep
        files: '^backend/app/core/.*\.py$'

      # A cross-feature import hidden inside a function body hides the feature
      # DAG: layering becomes load-order luck, and a cycle surfaces only as an
      # ImportError at startup. Same-feature imports are relative and pass;
      # module-level imports start at column zero and pass. An `if
      # TYPE_CHECKING:` block is indented and would trip this too, which is
      # not a false positive here: the feature names that cross a boundary
      # appear in `Mapped[...]` annotations SQLAlchemy resolves at runtime, so
      # models.py and jobs/base.py both import them for real and say why.
      # See #190.
      - id: forbid-function-level-feature-imports
        name: features import other features at module top level only
        entry: '^\s+from\s+app\.features\.[a-z_]+'
        language: pygrep
        files: '^backend/app/features/.*\.py$'

      # Reviewed Alembic revisions are the schema authority. This catches the
      # committed-code half of that rule; dropping or resetting a populated
      # schema is a runtime action no hook can see.
      - id: forbid-metadata-create-all
        name: Forbid Base.metadata.create_all (Alembic owns the schema)
        entry: 'metadata\.create_all'
        language: pygrep
        files: \.py$

      # `Field(None, description=...)` passes the default positionally, and
      # Pyright's dataclass_transform handling does not recognise that as a
      # default — so it types the field as REQUIRED while Pydantic treats it as
      # optional at runtime. The two disagree silently: constructing the model
      # the way production does is a type error, and no gate reports it until
      # something tries to build one in checked code. Only `Field(default=...)`
      # is understood. `Field(...)` (genuinely required) and keyword-only forms
      # like `Field(min_length=3)` are fine, so the rule targets a positional
      # first argument specifically.
      - id: forbid-positional-field-default
        name: Pydantic Field defaults must be keyword (Field(default=...))
        entry: 'Field\((?!\s*(?:\)|\.\.\.|[A-Za-z_]\w*\s*=))\s*\S'
        language: pygrep
        args: [--multiline]
        files: '^backend/.*\.py$'

      # All data fetching goes through TanStack Query over the validated
      # client in lib/core. axios itself belongs to that client and its
      # tests, so those two trees are excluded rather than the rest of the
      # app being opted in — a rogue client under lib/ would otherwise pass.
      # A type-only import performs no request, and static, require and
      # dynamic forms all count.
      - id: forbid-direct-axios
        name: No direct axios outside lib/core (use the validated client)
        entry: '^(?!\s*(?://|\*|/\*)).*(?:require\(\s*["'']axios["'']\s*\)|import\(\s*["'']axios["'']\s*\))|^(?!\s*(?://|\*|/\*)|\s*import\s+type\b).*from\s+["'']axios["'']'
        language: pygrep
        files: '^frontend/(?!node_modules/|lib/core/|tests/).*\.(?:ts|tsx|js|jsx)$'

      # Same rule as the axios hook, other half: data fetching goes through
      # TanStack Query over the validated client. features/auth is excluded
      # because token bootstrapping sits *below* that client — it cannot call
      # the thing whose token it is refreshing. global-error.tsx replaces the
      # whole document and must not import the application graph that threw;
      # its beacon is a same-origin POST of a capped JSON body, not product
      # data fetching.
      - id: forbid-direct-fetch
        name: No raw fetch() in UI code (use the validated client)
        entry: '^(?!\s*(?://|\*|/\*))(?=.*(?:(?<![.\w])fetch\s*\(|(?:globalThis|window|self)\.fetch\s*\())'
        language: pygrep
        files: '^frontend/(app|components|features)/.*\.(?:ts|tsx)$'
        exclude: '^frontend/(features/auth/|app/global-error\.tsx$)'

      # The Data Dragon version is resolved once through the cached manifest
      # helper. A hardcoded CDN URL elsewhere pins a version that then rots.
      - id: forbid-hardcoded-ddragon-url
        name: Data Dragon URLs belong to the lib/core helper
        entry: '(?i)ddragon\.leagueoflegends\.com'
        language: pygrep
        files: '^frontend/(?!node_modules/).*\.(?:ts|tsx)$'
        exclude: '^frontend/(?:lib/core/riot/data-dragon(?:-version)?\.ts$|next\.config\.ts$|tests/)'

      # Objective icons are Riot's own art. An icon-library approximation is
      # visually close enough to pass review and wrong for the product.
      - id: forbid-icon-library-objective-icons
        name: Objective icons stay Riot art, not icon-library shapes
        entry: 'lucide-react|react-icons|@heroicons'
        language: pygrep
        files: '^frontend/features/matches/components/objective-icon'

      # This project standardized on proxy.ts. Next resolves only
      # `middleware.js|ts` (the installed docs say `proxy.js|ts`, middleware
      # being the deprecated name), so .tsx/.jsx/.mjs cannot take effect on
      # their own — they are caught anyway because a file with that basename
      # states an intent to add request interception outside proxy.ts.
      - id: forbid-nextjs-middleware
        name: Next.js interception lives in proxy.ts, not middleware.ts
        entry: 'This project uses frontend/proxy.ts, not middleware.ts:'
        language: fail
        files: '^frontend/(src/)?middleware\.(ts|tsx|js|jsx|mjs)$'

      # Relative-link integrity and the docs/README.md topic index. Runs over
      # the tracked corpus, not the staged subset: a rename breaks links in
      # files the commit never touches. always_run because deleting a linked
      # target stages no Markdown at all, and that is exactly the case a
      # file filter would skip.
      - id: check-docs-links
        name: Docs links resolve and topics are indexed
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/tools/check-docs-links.sh"'
        language: system
        always_run: true
        pass_filenames: false

  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Run the linter
      - id: ruff
        args: ["--fix", "--config=backend/pyproject.toml"]
      # Run the formatter
      - id: ruff-format
        args: ["--config=backend/pyproject.toml"]

  # Backend static analysis via the locked uv project. These stay
  # corpus-wide (`pass_filenames: false` + `always_run`) so a staged
  # subset or a deletion-only commit cannot hide a project-level
  # finding. `--locked` refuses to rewrite uv.lock mid-commit.
  # Pytest and live CVE scans stay out: the former needs the test
  # database, the latter is not deterministic.
  - repo: local
    hooks:
      - id: backend-bandit
        name: Bandit (medium/medium, skip B104)
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked bandit --quiet --recursive app scripts
          --severity-level medium --confidence-level medium --skip B104'
        language: system
        pass_filenames: false
        always_run: true

      # Ruff has no plugin API and no comment-length rule, so the Python half
      # of the frontend's three comment rules is a stdlib script.
      - id: backend-comment-hygiene
        name: Comment hygiene (length, deferrals, compat shims)
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked python scripts/check_comments.py app tests scripts'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-pyright
        name: Pyright
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked pyright'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-vulture
        name: vulture (dead code, min-confidence 80)
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked vulture'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-deptry
        name: deptry (unused/missing deps)
        entry: >
          bash -c 'repository_root="$(git rev-parse --show-toplevel)" &&
          cd "$repository_root/backend" &&
          uv run --locked deptry .'
        language: system
        pass_filenames: false
        always_run: true

      - id: backend-xenon
        name: xenon (cyclomatic complexity <= B)
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/tools/run-xenon.sh"'
        language: system
        pass_filenames: false
        always_run: true

  # Frontend linting with oxlint (local hook for better compatibility)
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend oxlint
        entry: >
          bash -c 'export LC_ALL=C.UTF-8 &&
          repository_root="$(git rev-parse --show-toplevel)" &&
          source "$repository_root/tools/use-project-node.sh" && cd "$repository_root/frontend" &&
          if [ ! -d node_modules ]; then
          echo "❌ ERROR: Frontend dependencies not installed! Run: cd frontend && npm install";
          exit 1;
          fi &&
          npm run lint -- --max-warnings 0 ||
          (echo "❌ Frontend linting failed! Fix errors before committing." && exit 1)'
        language: system
        # `.mts` is here for `oxlint.config.mts` and the house plugins: a rule
        # or a scope changed there is exactly when this needs to run.
        files: ^frontend/.*\.(ts|tsx|js|jsx|mts)$
        exclude: ^frontend/node_modules/
        pass_filenames: false

  # Frontend TypeScript type checking
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: TypeScript Type Check
        entry: >
          bash -c 'export LC_ALL=C.UTF-8 &&
          repository_root="$(git rev-parse --show-toplevel)" &&
          source "$repository_root/tools/use-project-node.sh" && cd "$repository_root/frontend" &&
          if [ ! -d node_modules ]; then
          echo "❌ ERROR: Frontend dependencies not installed! Run: cd frontend && npm install";
          exit 1;
          fi &&
          npx tsc --noEmit ||
          (echo "❌ TypeScript type checking failed! Fix type errors before committing." && exit 1)'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        exclude: ^frontend/node_modules/
        pass_filenames: false

  # Shell and workflow linting, using the same pinned binaries as the gate
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/tools/run-shellcheck.sh"'
        language: system
        files: \.sh$|^\.githooks/
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: bash -c 'exec "$(git rev-parse --show-toplevel)/tools/run-actionlint.sh"'
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
        pass_filenames: false

# Configuration for pre-commit
default_stages: [pre-commit]
fail_fast: false

# Exclude certain paths from all hooks
exclude: |
  (?x)^(
    \.git/.*|
    \.tox/.*|
    build/.*|
    dist/.*|
    .*\.min\.(js|css)$|
    __pycache__/.*|
    frontend/node_modules/.*
  )$
